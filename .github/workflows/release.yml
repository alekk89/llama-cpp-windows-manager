name: Signed release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-portable:
    name: Build signed Windows portable
    runs-on: windows-latest
    timeout-minutes: 30
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Import code-signing certificate
        id: signing
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64)) {
            throw "WINDOWS_SIGNING_PFX_BASE64 is required for public release builds."
          }
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_PASSWORD)) {
            throw "WINDOWS_SIGNING_PFX_PASSWORD is required for public release builds."
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "llama-cpp-windows-manager-signing.pfx"
          try {
            [System.IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
            $password = ConvertTo-SecureString $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
            if (-not $certificate.HasPrivateKey) { throw "The imported signing certificate has no private key." }
            "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT
          } finally {
            if (Test-Path -LiteralPath $pfxPath) { Remove-Item -LiteralPath $pfxPath -Force }
          }

      - name: Install Inno Setup
        id: inno
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $compiler = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $compiler) { $compiler = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) { throw "Inno Setup compiler was not found." }
          "path=$compiler" >> $env:GITHUB_OUTPUT

      - name: Run signed release gate
        shell: pwsh
        run: >-
          .\test-release-gate.ps1 -Configuration Release -Runtime win-x64
          -IncludePublish -IncludeInstaller -InnoSetupPath "${{ steps.inno.outputs.path }}"
          -CertificateThumbprint "${{ steps.signing.outputs.thumbprint }}"
          -RequireSigned

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: LlamaCppWindowsManager-win-x64-signed-release
          if-no-files-found: error
          path: |
            dist/LlamaCppWindowsManager-win-x64/LlamaCppWindowsManager.exe
            dist/LlamaCppWindowsManager-win-x64/LlamaCppWindowsManager.exe.sha256
            dist/LlamaCppWindowsManager-win-x64/llwmctl.exe
            dist/LlamaCppWindowsManager-win-x64/llwmctl.exe.sha256
            dist/LlamaCppWindowsManager-win-x64/AGENTS.md
            dist/LlamaCppWindowsManager-win-x64/agent.md
            dist/LlamaCppWindowsManager-win-x64/docs/CONTROL_API.md
            dist/LlamaCppWindowsManager-win-x64.zip
            dist/LlamaCppWindowsManager-win-x64.zip.sha256
            dist/installer/LlamaCppWindowsManager-Setup-*-win-x64.exe
            dist/installer/LlamaCppWindowsManager-Setup-*-win-x64.exe.sha256

      - name: Remove imported certificate
        if: always() && steps.signing.outputs.thumbprint != ''
        shell: pwsh
        run: |
          $path = "Cert:\CurrentUser\My\${{ steps.signing.outputs.thumbprint }}"
          if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Force }
