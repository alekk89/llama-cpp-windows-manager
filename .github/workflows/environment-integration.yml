name: Scheduled environment integration

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  environment:
    name: ${{ matrix.lane }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: windows-no-gpu
            runner: llwm-no-gpu
          - lane: wsl-cpu
            runner: llwm-wsl-cpu
          - lane: wsl-nvidia
            runner: llwm-wsl-nvidia
          - lane: intel
            runner: llwm-intel
          - lane: amd
            runner: llwm-amd
    runs-on: [self-hosted, windows, "${{ matrix.runner }}"]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Run isolated capability lane
        shell: pwsh
        run: .\scripts\test-environment-integration.ps1 -Lane "${{ matrix.lane }}"
      - name: Upload bounded diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: environment-${{ matrix.lane }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: artifacts/environment-integration/
