name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-publish:
    name: Build, test, and publish
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Check code shape
        shell: pwsh
        run: .\scripts\check-code-shape.ps1

      - name: Restore and build
        shell: pwsh
        run: .\scripts\build-app.ps1 -Restore -LockedRestore

      - name: Verify updater handoff without instrumentation
        shell: pwsh
        run: dotnet test --project tests/LocalLlmConsole.Tests --no-restore --filter-class '*UpdateHandoffTests'

      - name: Test and enforce coverage
        shell: pwsh
        run: .\scripts\test-coverage.ps1

      - name: Verify formatting
        shell: pwsh
        run: dotnet format LocalLlmConsole.sln --verify-no-changes --verbosity minimal

      - name: Check diff whitespace
        shell: pwsh
        run: git diff --check

      - name: Validate documentation links and commands
        shell: pwsh
        run: .\scripts\test-docs.ps1

      - name: Package security and currency audit
        shell: pwsh
        run: .\scripts\test-vulnerabilities.ps1

      - name: Publish smoke
        shell: pwsh
        run: .\scripts\publish-app.ps1

      - name: Verify publish contents
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist\LlamaCppWindowsManager-win-x64\LlamaCppWindowsManager.exe"
          $publishDir = Split-Path -Parent $exe
          $zip = Join-Path $PWD "dist\LlamaCppWindowsManager-win-x64.zip"
          if (-not (Test-Path -LiteralPath $exe)) { throw "Published executable was not produced: $exe" }
          if (-not (Test-Path -LiteralPath "$exe.sha256")) { throw "Published executable checksum was not produced: $exe.sha256" }
          foreach ($sidecar in @("llwmctl.exe", "llwmctl.exe.sha256", "AGENTS.md", "agent.md", "docs\CONTROL_API.md", "sbom.spdx.json")) {
            $sidecarPath = Join-Path $publishDir $sidecar
            if (-not (Test-Path -LiteralPath $sidecarPath -PathType Leaf)) { throw "Required control sidecar was not produced: $sidecarPath" }
          }
          if (Test-Path -LiteralPath (Join-Path (Split-Path -Parent $exe) "LlamaCppConsole.exe")) { throw "Removed legacy executable alias was published." }
          if (Test-Path -LiteralPath $zip) { throw "Obsolete portable ZIP was published." }
          $pdbs = Get-ChildItem -Path (Split-Path -Parent $exe) -Recurse -Filter *.pdb -File -ErrorAction SilentlyContinue
          if ($pdbs) { throw "Release publish contains PDB files." }

      - name: Install pinned Inno Setup
        id: inno
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Pinned Inno Setup installation failed with exit code $LASTEXITCODE." }
          $compiler = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $compiler) { $compiler = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) { throw "Inno Setup compiler was not found." }
          "path=$compiler" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        run: .\scripts\build-installer.ps1 -SkipPublish -InnoSetupPath "${{ steps.inno.outputs.path }}"

      - name: Test silent install, repair, and uninstall
        shell: pwsh
        run: |
          $installer = Get-ChildItem .\dist\installer\LlamaCppWindowsManager-Setup-*-win-x64.exe -File
          if ($installer.Count -ne 1) { throw "Expected exactly one installer, found $($installer.Count)." }
          .\scripts\test-installer-smoke.ps1 -InstallerPath $installer.FullName

      - name: Test previous stable installer upgrade
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem .\dist\installer\LlamaCppWindowsManager-Setup-*-win-x64.exe -File)
          if ($installer.Count -ne 1) { throw "Expected exactly one installer." }
          .\scripts\test-previous-version-upgrade.ps1 -CandidateInstallerPath $installer[0].FullName

      - name: Test standalone portable EXE update
        shell: pwsh
        run: .\scripts\test-portable-update.ps1 -CandidateExePath .\dist\LlamaCppWindowsManager-win-x64\LlamaCppWindowsManager.exe

      - name: Upload installer failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: installer-diagnostics-${{ github.run_id }}
          path: TestResults/installer-upgrade
          if-no-files-found: ignore
          retention-days: 14
